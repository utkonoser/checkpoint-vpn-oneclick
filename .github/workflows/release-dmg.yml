name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + Rust
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        env:
          VERSION: ${{ inputs.tag }}
        run: make dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/CheckpointVPNOneClick-*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          shopt -s nullglob
          mapfile -t assets < <(find dist -type f -name 'CheckpointVPNOneClick-*.dmg' | sort)
          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "Expected DMG under dist/" >&2
            find dist -type f >&2 || true
            exit 1
          fi
          notes="macOS DMG (ad-hoc signed, macOS 14+) with embedded CheckpointVPNTunnel helper.

          - First launch: right-click → Open. Admin password only when a helper is missing or broken.
          - Work VPN: split tunnel and exclude lists. Empty split list keeps gateway Office Mode.
          - Personal proxy: independent sing-box subscription, include and exclude lists, node list sorted by ping.
          - AGPL tunnel engine source: Vendor/snx-rs. sing-box is GPL-3 (see THIRD_PARTY.md)."
          gh release create "$tag" "${assets[@]}" \
            --title "Checkpoint VPN One-Click $tag" \
            --notes "$notes" \
            --latest
