name: Release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG and publish release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + Rust
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        env:
          VERSION: ${{ inputs.tag }}
        run: make dmg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          gh release create "$tag" build/CheckpointVPNOneClick-*.dmg \
            --title "Checkpoint VPN One-Click $tag" \
            --notes "Ad-hoc signed macOS 14+ universal DMG with embedded CheckpointVPNTunnel helper (snx-rs AGPL fork). First launch: right-click → Open. First Connect asks for admin once to install the LaunchDaemon. Split-tunnel work VPN; use Karing for the rest. Source for the helper: Vendor/snx-rs in this repo." \
            --latest
