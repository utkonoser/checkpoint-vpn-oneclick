name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + Rust
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        env:
          VERSION: ${{ inputs.tag }}
        run: make dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/CheckpointVPNOneClick-*.dmg
          if-no-files-found: error

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assemble release APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/CheckpointVPNOneClick-${{ inputs.tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/CheckpointVPNOneClick-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [dmg, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          shopt -s nullglob
          mapfile -t assets < <(find dist -type f \( -name 'CheckpointVPNOneClick-*.dmg' -o -name 'CheckpointVPNOneClick-*.apk' \) | sort)
          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "Expected DMG + APK under dist/" >&2
            find dist -type f >&2 || true
            exit 1
          fi
          notes="macOS DMG (ad-hoc signed, macOS 14+) with embedded CheckpointVPNTunnel helper, plus Android sideload APK (VpnService + snxcore JNI).

          - First macOS launch: right-click → Open. First Connect asks for admin once for the LaunchDaemon.
          - Android: adb install the APK; grant VPN permission on first Connect.
          - Split-tunnel work VPN; optional CIDR/hostname list.
          - AGPL tunnel engine source: Vendor/snx-rs (+ android/engine for the JNI bridge)."
          gh release create "$tag" "${assets[@]}" \
            --title "Checkpoint VPN One-Click $tag" \
            --notes "$notes" \
            --latest
