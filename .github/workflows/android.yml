name: Android

on:
  push:
    paths:
      - "android/**"
      - "Vendor/snx-rs/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "Vendor/snx-rs/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assemble release APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-vpn-oneclick-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
