name: CheckpointVPNOneClick
options:
  bundleIdPrefix: local.checkpointvpn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_DEBUG_DYLIB: NO
targets:
  CheckpointVPNOneClick:
    type: application
    platform: macOS
    sources:
      - path: CheckpointVPNOneClick
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.checkpointvpn.oneclick
        PRODUCT_NAME: CheckpointVPNOneClick
        PRODUCT_MODULE_NAME: CheckpointVPNOneClick
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Checkpoint VPN
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Fills Check Point VPN login fields with the saved password and TOTP.
        CODE_SIGN_ENTITLEMENTS: CheckpointVPNOneClick/CheckpointVPNOneClick.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_TESTABILITY: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: CheckpointVPNOneClick/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: Fills Check Point VPN login fields with the saved password and TOTP.
    entitlements:
      path: CheckpointVPNOneClick/CheckpointVPNOneClick.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
  CheckpointVPNOneClickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CheckpointVPNOneClickTests
    dependencies:
      - target: CheckpointVPNOneClick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.checkpointvpn.oneclick.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CheckpointVPNOneClick.app/Contents/MacOS/CheckpointVPNOneClick"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CheckpointVPNOneClick:
    build:
      targets:
        CheckpointVPNOneClick: all
        CheckpointVPNOneClickTests: [test]
    test:
      targets:
        - CheckpointVPNOneClickTests
